- name: Update all packages
  apt: name="*" state=latest update_cache=true force_apt_get=true

- name: Install snapd
  apt: name=snapd state=latest

- name: Remove certbot
  apt: name=certbot state=absent

- name: Snap Install Certbot
  command: snap install --classic certbot

- name: Setup Certbot Symlink
  file: path=/usr/bin/certbot
        src=/snap/bin/certbot
        state=link 

- name: Check for existing certificate
  stat:
    path: "/etc/letsencrypt/live/{{ DOMAIN }}/fullchain.pem"
  register: certificate_file

- name: Register certificate for the first time
  command: >-
    certbot certonly --standalone --non-interactive
    -d {{ DOMAIN }} -m {{ EMAIL }} --agree-tos --no-eff-email
  when: not certificate_file.stat.exists

- name: Renew existing certificate when necessary
  command: >-
    certbot renew --cert-name {{ DOMAIN }} --non-interactive
  register: certificate_renewal
  changed_when: "'not yet due for renewal' not in certificate_renewal.stdout"
  when: certificate_file.stat.exists
